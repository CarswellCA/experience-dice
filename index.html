<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sequential Two-Dice Roller</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f6f9; padding: 20px; color: #333; }
        h1 { margin-bottom: 5px; }
        .instructions { color: #666; margin-bottom: 30px; font-size: 16px; }
        
        .game-flow { display: flex; justify-content: center; align-items: center; gap: 40px; margin: 20px auto; max-width: 600px; }
        .step-container { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        
        .die { width: 180px; height: 180px; border-radius: 15px; overflow: hidden;
               box-shadow: 0 6px 12px rgba(0,0,0,0.1); transition: all 0.2s ease; 
               background: white; display: flex; align-items: center; justify-content: center; position: relative; }
        .die img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Specific Dice Styles */
        #die-blue { border: 4px solid #0d47a1; background: #e3f2fd; }
        #die-yellow { border: 4px solid #f57f17; background: #fffde7; }
        
        /* Locked State for Yellow Die */
        .locked { opacity: 0.3; pointer-events: none; filter: grayscale(80%); }
        
        .label { font-weight: bold; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .label-blue { color: #0d47a1; }
        .label-yellow { color: #e65100; }

        button { padding: 12px 24px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        #btn-blue { background: #0d47a1; }
        #btn-blue:hover { background: #0a377d; }
        #btn-yellow { background: #f57f17; }
        #btn-yellow:hover { background: #e65100; }
        
        .arrow { font-size: 32px; color: #ccc; font-weight: bold; margin-top: -40px; }
        .placeholder { font-size: 16px; font-weight: bold; color: #888; padding: 10px; text-align: center; }
    </style>
</head>
<body>

    <h1>Two-Step Experience Roller</h1>
    <p class="instructions">Step 1: Roll the Blue Die first. Step 2: The Yellow Die will unlock for your second roll.</p>

    <div class="game-flow">
        <!-- STEP 1: BLUE DIE -->
        <div class="step-container">
            <div class="label label-blue">1st: Blue Die</div>
            <div id="die-blue" class="die">
                <span class="placeholder">Roll Blue First</span>
            </div>
            <button id="btn-blue" onclick="rollBlue()">Roll Blue</button>
        </div>

        <!-- VISUAL ARROW SEPARATOR -->
        <div class="arrow">➔</div>

        <!-- STEP 2: YELLOW DIE (LOCKED BY DEFAULT) -->
        <div class="step-container locked" id="yellow-container">
            <div class="label label-yellow">2nd: Yellow Die</div>
            <div id="die-yellow" class="die">
                <span class="placeholder">Locked</span>
            </div>
            <button id="btn-yellow" onclick="rollYellow()">Roll Yellow</button>
        </div>
    </div>

    <script>
        // Set your image file extension (.png or .jpg)
        const ext = '.png';

        // Synthesize a realistic dice rolling sound using native browser audio nodes
        function playDiceSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                // Generate a series of small micro-impacts to sound like a rolling die
                const now = ctx.currentTime;
                const impacts = 5 + Math.floor(Math.random() * 4); // 5 to 8 tumbling bounces
                
                for (let i = 0; i < impacts; i++) {
                    const timeOffset = i * 0.06 + (Math.random() * 0.02);
                    const hitTime = now + timeOffset;
                    
                    // Oscillator for the low-mid thud tone of a plastic die
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = 'triangle';
                    // Randomize pitch slightly per tumble step for realism
                    osc.frequency.setValueAtTime(120 + Math.random() * 60, hitTime);
                    osc.frequency.exponentialRampToValueAtTime(40, hitTime + 0.05);
                    
                    // Extremely fast volume envelope per impact bounce
                    gain.gain.setValueAtTime(0.3 - (i * 0.03), hitTime); // sound decays over time
                    gain.gain.exponentialRampToValueAtTime(0.01, hitTime + 0.05);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start(hitTime);
                    osc.stop(hitTime + 0.06);
                }
            } catch (e) {
                console.log("Audio play blocked or unsupported:", e);
            }
        }

        function rollBlue() {
            playDiceSound();
            const die = document.getElementById('die-blue');
            
            // Trigger visual shake
            die.style.transform = 'scale(0.9) rotate(-10deg)';
            
            setTimeout(() => {
                // Pick a random number between 1 and 6 (Blue images)
                const rand = Math.floor(Math.random() * 6) + 1;
                die.innerHTML = `<img src="${rand}${ext}" alt="Blue Experience ${rand}">`;
                die.style.transform = 'none';
                
                // Unlock the yellow die step smoothly
                const yellowContainer = document.getElementById('yellow-container');
                yellowContainer.classList.remove('locked');
                document.getElementById('die-yellow').innerHTML = `<span class="placeholder">Ready to Roll</span>`;
            }, 250);
        }

        function rollYellow() {
            playDiceSound();
            const die = document.getElementById('die-yellow');
            
            // Trigger visual shake
            die.style.transform = 'scale(0.9) rotate(10deg)';
            
            setTimeout(() => {
                // Pick a random number between 7 and 12 (Yellow images)
                const rand = Math.floor(Math.random() * 6) + 7;
                die.innerHTML = `<img src="${rand}${ext}" alt="Yellow Experience ${rand}">`;
                die.style.transform = 'none';
            }, 250);
        }
    </script>
</body>
</html>
